<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <div class="logo">
                    <img src="logo.png" alt="Meal Planner Pro">
                    <h1>Meal Planner Pro</h1>
                </div>
                <div class="settings-dropdown">
                    <button @click="toggleSettingsMenu" class="settings-toggle">
                        <i class="bi bi-gear-fill carrot-icon"></i>
                    </button>
                    <div v-if="showSettingsMenu" class="settings-menu">
                        <button @click="toggleDarkMode" class="settings-item">
                            <i class="bi" :class="darkMode ? 'bi-sun' : 'bi-moon'"></i>
                            {{ darkMode ? 'Light Mode' : 'Dark Mode' }}
                        </button>
                        <button @click="exportData" class="settings-item">
                            <i class="bi bi-download"></i> Export Data
                        </button>
                        <button @click="showImportModal = true; showSettingsMenu = false" class="settings-item">
                            <i class="bi bi-upload"></i> Import Data
                        </button>
                    </div>
                </div>
            </div>
            <nav>
                <button :class="{ active: activeTab === 'menu' }" @click="activeTab = 'menu'">
                    <i class="bi bi-calendar-week"></i> Menu
                </button>
                <button :class="{ active: activeTab === 'favorites' }" @click="activeTab = 'favorites'">
                    <i class="bi bi-heart"></i> Favorites
                </button>
                <button :class="{ active: activeTab === 'shopping' }" @click="activeTab = 'shopping'">
                    <i class="bi bi-cart"></i> Shopping List
                </button>
                <button :class="{ active: activeTab === 'household' }" @click="activeTab = 'household'">
                    <i class="bi bi-house"></i> Household Essentials
                </button>
                <button :class="{ active: activeTab === 'kitchen' }" @click="activeTab = 'kitchen'">
                    <i class="bi bi-cup-hot"></i> Kitchen Inventory
                </button>
            </nav>
        </header>

        <main>
            <menu-section></menu-section>
            <favorites-section></favorites-section>
            <shopping-section></shopping-section>
            <household-section></household-section>
            <kitchen-section></kitchen-section>
        </main>

        <modals></modals>
    </div>
    
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
